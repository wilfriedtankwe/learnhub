<!-- LibraryUI : Slide (carousel) -->
<section class="bg-[#0f172a] flex flex-col items-center justify-center px-4 pt-16 pb-16 font-sans select-none"
         (touchstart)="onTouchStart($event)"
         (touchend)="onTouchEnd($event)">

  <!-- En-tête -->
  <div class="text-center mb-10">
    <h2 class="text-[2rem] font-bold text-slate-100 tracking-tight m-0 mb-2">Formations à la une</h2>
    <p class="text-sm text-slate-400 leading-relaxed m-0">
      Glissez ou utilisez les flèches<br>pour découvrir nos meilleures formations.
    </p>
  </div>

  <!-- Piste du carrousel -->
  <div class="flex items-center justify-center gap-4 w-full max-w-225 perspective-distant">
    @for (item of getVisibleCards(); track item.cluster.id) {
      <div
        class="cc-card rounded-2xl overflow-hidden bg-slate-800 shrink-0"
        [class.cc-card--prev]="item.position === 'prev'"
        [class.cc-card--next]="item.position === 'next'"
        [class.cc-card--active]="item.position === 'active'"
        [class.cursor-pointer]="item.position !== 'active'"
        (click)="onCardClick(item.position)">

        <!-- Image de couverture + avatar du formateur -->
        <div class="relative w-full aspect-4/3 overflow-visible">
          <img [src]="item.cluster.image" [alt]="item.cluster.name"
               class="w-full h-full object-cover block rounded-t-2xl" />
          <div class="absolute -bottom-4.5 left-1/2 -translate-x-1/2 z-10 w-11 h-11 rounded-full border-[2.5px] border-slate-800 overflow-hidden bg-slate-600">
            <img [src]="item.cluster.avatar" [alt]="item.cluster.handle" class="w-full h-full object-cover block" />
          </div>
        </div>

        <!-- Corps de la carte -->
        <div class="flex flex-col items-center text-center gap-1 px-4 pt-6 pb-5">
          <h3 class="text-base font-bold text-slate-100 m-0">{{ item.cluster.name }}</h3>
          <p class="text-xs text-slate-400 m-0 flex items-center gap-1">
            {{ item.cluster.handle }}
            @if (item.cluster.verified) {
              <span class="text-amber-400 text-[0.7rem]">★ Best-seller</span>
            }
          </p>
          <a routerLink="/catalogue"
             class="cc-btn mt-1.5 bg-indigo-600 text-white rounded-full px-6 py-1.5 text-xs font-semibold no-underline transition-colors">
            Voir · {{ item.cluster.price }} €
          </a>
        </div>
      </div>
    }
  </div>

  <!-- Flèches de navigation -->
  <div class="flex gap-2.5 mt-8">
    <button type="button"
            class="cc-arrow w-9 h-9 rounded-full bg-transparent border border-slate-600 text-slate-300 flex items-center justify-center cursor-pointer transition-all"
            (click)="prev()" aria-label="Formation précédente">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <button type="button"
            class="cc-arrow w-9 h-9 rounded-full bg-transparent border border-slate-600 text-slate-300 flex items-center justify-center cursor-pointer transition-all"
            (click)="next()" aria-label="Formation suivante">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>
</section>
