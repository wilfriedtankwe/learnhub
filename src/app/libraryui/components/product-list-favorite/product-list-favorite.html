<!-- LibraryUI : Products list shopping -->
<div class="mx-auto grid w-full max-w-6xl grid-cols-1 gap-x-5 gap-y-8 border-b border-gray-100 p-6 sm:grid-cols-2 lg:grid-cols-3">
  @for (product of products(); track product.id) {
    <article class="flex flex-col">
      <div class="aspect-video w-full overflow-hidden rounded-lg bg-gray-50">
        <img
          [src]="imageUrl(product)"
          [alt]="product.name"
          loading="lazy"
          class="h-full w-full object-cover"
        />
      </div>

      <div class="mt-3 flex flex-col">
        <h3 class="text-sm font-semibold text-gray-900">{{ product.name }}</h3>
        <p class="mt-0.5 truncate text-xs text-gray-500">{{ product.description }}</p>

        <div class="mt-2 flex items-center justify-between gap-2">
          <p class="text-sm">
            <span class="font-bold text-gray-900">{{ product.price }} €</span>
            <span class="ml-1.5 text-gray-400 line-through">{{ product.mrp }} €</span>
          </p>

          <div class="flex shrink-0 items-center gap-0.5" [attr.aria-label]="product.rating + ' sur 5'">
            @for (starIndex of stars; track starIndex) {
              <svg
                class="h-3.5 w-3.5 {{ starIndex < product.rating ? 'text-amber-400' : 'text-gray-300' }}"
                viewBox="0 0 20 20"
                fill="currentColor"
                aria-hidden="true"
              >
                <path d="M10 1.5 12.47 6.9l5.94.77-4.36 4.09 1.15 5.87L10 14.77l-5.2 2.86 1.15-5.87L1.6 7.67l5.94-.77Z" />
              </svg>
            }
          </div>
        </div>

        <div class="mt-3 flex items-center gap-2">
          <button
            type="button"
            class="flex-1 rounded-md bg-indigo-600 py-2 text-sm font-semibold text-white transition-colors duration-150 hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-900 active:bg-indigo-900"
            (click)="onAddToCart(product)"
          >
            Ajouter au panier
          </button>

          <button
            type="button"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md border transition-colors duration-150 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-900 {{
              product.isFavorite
                ? 'border-red-200 bg-red-50 text-red-600'
                : 'border-gray-300 text-gray-500 hover:border-gray-400 hover:text-gray-700'
            }}"
            [attr.aria-pressed]="product.isFavorite"
            [attr.aria-label]="(product.isFavorite ? 'Retirer ' : 'Ajouter ') + product.name + ' des favoris'"
            (click)="onToggleFavorite(product)"
          >
            @if (product.isFavorite) {
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                <path fill="currentColor" d="m12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5C2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3C19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z" />
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                <path fill="currentColor" d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3C4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5C22 5.42 19.58 3 16.5 3m-4.4 15.55l-.1.1l-.1-.1C7.14 14.24 4 11.39 4 8.5C4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5c0 2.89-3.14 5.74-7.9 10.05" />
              </svg>
            }
          </button>
        </div>
      </div>
    </article>
  } @empty {
    <p class="col-span-full py-12 text-center text-gray-500">
      Aucune formation ne correspond à votre recherche.
    </p>
  }
</div>
