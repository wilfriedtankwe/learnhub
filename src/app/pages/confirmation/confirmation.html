@if (order(); as o) {
  <section class="mx-auto max-w-2xl px-6 py-16 text-center">
    <!-- ===== EMPLACEMENT : composant LibraryUI « Confirmations » ===== -->
    <h1 class="text-3xl font-extrabold text-emerald-600">Commande validée !</h1>
    <p class="mt-3 text-slate-600">
      Merci ! Un email de confirmation a été envoyé à <strong>{{ o.email }}</strong>.
    </p>
    <p class="mt-1 text-sm text-slate-500">Commande n° {{ o.id }} · Total : {{ o.total }} €</p>
    <!-- ============================================================= -->

    <a routerLink="/dashboard"
       class="mt-8 inline-block rounded-lg bg-indigo-600 px-6 py-3 font-semibold text-white hover:bg-indigo-700">
      Accéder à mon espace
    </a>
  </section>
}
